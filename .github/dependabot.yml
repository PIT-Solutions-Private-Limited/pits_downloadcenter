version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/Resources/Private/UI"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    # Stay on the Angular 21 LTS line (Angular 22.0.x has a zone change detection regression).
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - "minor"
          - "patch"
